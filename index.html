<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINETIC DESKS | متجر المكاتب</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0F172A;
      --bg-card: #1E293B;
      --accent: #F59E0B;
      --green: #10B981;
      --text: #F8FAFC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text); padding-bottom: 50px; }

    header {
      background: #020617;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      position: sticky; top: 0; z-index: 100;
    }

    .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .nav-btns { display: flex; gap: 10px; }

    button {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-add { background: var(--accent); color: #000; }
    .btn-cart { background: #334155; color: #fff; position: relative; }
    .badge { background: red; color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; }

    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .price { color: var(--accent); font-size: 1.2rem; font-weight: bold; margin: 10px 0; }

    .btn-buy { background: var(--green); color: #fff; width: 100%; padding: 10px; }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-card);
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 450px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #334155;
      background: #0F172A;
      color: #fff;
    }

    /* Cart Sidebar */
    .cart-sidebar {
      position: fixed;
      top: 0; left: -350px;
      width: 320px; height: 100%;
      background: var(--bg-card);
      z-index: 300;
      transition: 0.3s;
      padding: 20px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .cart-sidebar.active { left: 0; }
    .cart-items { flex: 1; overflow-y: auto; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">KINETIC DESKS</div>
    <div class="nav-btns">
      <button class="btn-add" onclick="toggleModal('add-modal', true)">+ إضافة منتج</button>
      <button class="btn-cart" onclick="toggleCart(true)">
        السلة <span class="badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="container">
    <h2>المنتجات المتاحة</h2>
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- نافذة إضافة منتج -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">إضافة منتج جديد</h3>
      <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" id="p-name" placeholder="مكتب ألعاب فاخر">
      </div>
      <div class="form-group">
        <label>السعر (ر.ع)</label>
        <input type="number" id="p-price" placeholder="120">
      </div>
      <div class="form-group">
        <label>رابط الصورة</label>
        <input type="text" id="p-img" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>الوصف</label>
        <textarea id="p-desc" rows="2"></textarea>
      </div>
      <button class="btn-add" style="width: 100%; padding: 10px;" onclick="addNewProduct()">نشر المنتج</button>
      <button onclick="toggleModal('add-modal', false)" style="width: 100%; margin-top: 8px; background: transparent; color: #ccc;">إلغاء</button>
    </div>
  </div>

  <!-- سلة المشتريات والفاتورة -->
  <div class="cart-sidebar" id="cart-sidebar">
    <h3>سلة المشتريات</h3>
    
    <div style="margin-top: 15px;">
      <input type="text" id="c-name" placeholder="اسمك الكامل" style="width:100%; padding:8px; margin-bottom:8px; background:#0F172A; border:1px solid #334155; color:#fff; border-radius:4px;">
      <input type="text" id="c-city" placeholder="المدينة / الولاية" style="width:100%; padding:8px; background:#0F172A; border:1px solid #334155; color:#fff; border-radius:4px;">
    </div>

    <div class="cart-items" id="cart-items-list"></div>

    <div>
      <h4 style="margin-bottom: 10px;">الإجمالي: <span id="cart-total" style="color:var(--accent)">0</span> ر.ع</h4>
      <button class="btn-buy" onclick="sendInvoiceToWhatsApp()">إرسال الفاتورة عبر الواتساب</button>
      <button onclick="toggleCart(false)" style="width: 100%; margin-top: 8px; background: transparent; color: #ccc;">إغلاق</button>
    </div>
  </div>

  <script>
    // المنتجات الافتراضية
    let products = JSON.parse(localStorage.getItem('my_products')) || [
      { id: 1, name: 'مكتب Apex Pro Standing', price: 150, img: 'https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=500', desc: 'مكتب كهربائي قابل لتعديل الارتفاع' },
      { id: 2, name: 'مكتب Cyber RGB Gaming', price: 95, img: 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=500', desc: 'مكتب قيمنج مجهز بإضاءة' }
    ];

    let cart = [];

    // عرض المنتجات
    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=500'">
          <div class="card-body">
            <h4>${p.name}</h4>
            <p style="font-size:0.8rem; color:#94A3B8; margin-top:5px;">${p.desc || ''}</p>
            <div class="price">${p.price} ر.ع</div>
            <button class="btn-buy" onclick="addToCart(${p.id})">إضافة للسلة</button>
          </div>
        </div>
      `).join('');
    }

    // إضافة منتج جديد
    function addNewProduct() {
      const name = document.getElementById('p-name').value;
      const price = document.getElementById('p-price').value;
      const img = document.getElementById('p-img').value;
      const desc = document.getElementById('p-desc').value;

      if(!name || !price) {
        alert('يرجى كتابة الاسم والسعر على الأقل');
        return;
      }

      const newP = {
        id: Date.now(),
        name: name,
        price: parseFloat(price),
        img: img || 'https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=500',
        desc: desc
      };

      products.unshift(newP);
      localStorage.setItem('my_products', JSON.stringify(products));
      renderProducts();
      toggleModal('add-modal', false);

      // تفريغ الحقول
      document.getElementById('p-name').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-img').value = '';
      document.getElementById('p-desc').value = '';
    }

    // إدارة السلة
    function addToCart(id) {
      const p = products.find(item => item.id === id);
      cart.push(p);
      updateCartUI();
      toggleCart(true);
    }

    function updateCartUI() {
      document.getElementById('cart-count').textContent = cart.length;
      const list = document.getElementById('cart-items-list');
      
      list.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong>
            <div style="font-size:0.8rem; color:var(--accent);">${item.price} ر.ع</div>
          </div>
          <button onclick="removeFromCart(${index})" style="background:red; color:#fff; padding:2px 6px; font-size:0.7rem;">حذف</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').textContent = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    // تجهيز الفاتورة والواتساب
    function sendInvoiceToWhatsApp() {
      if(cart.length === 0) {
        alert('السلة فارغة!');
        return;
      }

      const name = document.getElementById('c-name').value || 'عميل';
      const city = document.getElementById('c-city').value || 'غير محدد';
      const total = cart.reduce((sum, item) => sum + item.price, 0);

      let msg = `🧾 *فاتورة طلب جديدة*\n`;
      msg += `👤 *العميل:* ${name}\n`;
      msg += `📍 *المدينة:* ${city}\n`;
      msg += `--------------------------------\n`;
      cart.forEach((item, i) => {
        msg += `${i+1}. ${item.name} - ${item.price} ر.ع\n`;
      });
      msg += `--------------------------------\n`;
      msg += `💰 *المجموع:* ${total} ر.ع`;

      const phone = "96872420073";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // النوافذ
    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('active', show);
    }
    function toggleCart(show) {
      document.getElementById('cart-sidebar').classList.toggle('active', show);
    }

    // تشغيل عند الفتح
    renderProducts();
  </script>
</body>
</html>
